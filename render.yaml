services:
  - type: web
    name: campusslot
    runtime: node
    plan: free
    branch: master
    buildCommand: MONGOMS_DISABLE_POSTINSTALL=1 npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.15.0
      - key: MONGODB_URI
        sync: false
      - key: SEED_DEMO
        value: "false"
